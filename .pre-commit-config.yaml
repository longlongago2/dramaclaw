# pre-commit 钩子 — dramaclaw-ce（SECRET-14）
# 一次性安装：
#   uv tool install pre-commit
#   uv tool run pre-commit install --install-hooks
# 手动全量扫描：
#   uv tool run pre-commit run --all-files
# 钩子会自动读取仓库根的 .gitleaks.toml（含 newAPI 自定义规则）。

repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: license-inventory
        name: Check license inventory from staged files
        entry: python -X utf8 -m scripts.compliance.update_license_inventory --check
        language: python
        pass_filenames: false
        always_run: true
        stages: [pre-commit, manual]
      - id: banned-words
        name: 禁用词 lint（开源/open source）
        entry: python -X utf8 scripts/lint_banned_words.py
        language: python
        pass_filenames: false
        always_run: true
